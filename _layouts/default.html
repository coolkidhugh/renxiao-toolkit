<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "写春秋管理咨询",
    "url": "https://www.xchqzx.com/",
    "sameAs": [
      "https://www.xchqzx.com/",
      "https://github.com/coolkidhugh/renxiao-toolkit"
    ],
    "description": "人效提升、组织诊断、薪酬绩效咨询"
  }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; line-height: 1.7; max-width: 720px; margin: 0 auto; padding: 1.5rem; color: #222; }
    a { color: #0969da; }
    nav { margin-bottom: 1.5rem; font-size: 0.95rem; }
    footer { margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid #eaecef; font-size: 0.9rem; color: #57606a; }
    h1 { font-size: 1.75rem; }
    h2 { font-size: 1.25rem; margin-top: 2rem; }
    code { background: #f6f8fa; padding: 0.1em 0.4em; border-radius: 4px; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #d0d7de; padding: 0.5rem 0.75rem; text-align: left; }
    th { background: #f6f8fa; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ site.baseurl }}/">写春秋人效工具包</a>
  </nav>
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
